# =============================================================================
# AI SOFTWARE TECHNOLOGY — FAIL2BAN CUSTOM NGINX SCANNER & 403/404/405 FILTER
# Place in: /etc/fail2ban/filter.d/nginx-ais-suspicious.conf
# Detects:
#   - Repeated 403/404/405 responses on hidden files (.env, .git), CMS probes
#     (wp-admin, wp-login, xmlrpc.php, phpmyadmin), backup/config extensions,
#     or disallowed HTTP methods (POST/PUT/DELETE to static SPA).
# =============================================================================

[Definition]
failregex = ^<HOST> - \S+ \[.*?\] "(?:GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH) /(?:(?:\.(?!well-known)\S*)|(?:wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|adminer|vendor|node_modules|actuator|server-status)\S*|\S*\.(?:env|git|sql|bak|php|asp|aspx|jsp|cgi|sh|conf|pem|key|map)(?:\?\S*)?) HTTP/\d\.\d" (?:400|403|404|405|444) \d+
            ^<HOST> - \S+ \[.*?\] "(?:POST|PUT|DELETE|PATCH|TRACE|CONNECT) \S+ HTTP/\d\.\d" 405 \d+

ignoreregex = ^<HOST> - \S+ \[.*?\] "GET /(?:robots\.txt|sitemap\.xml|llms\.txt|manifest\.json|favicon\.ico|\.well-known/acme-challenge/\S+) HTTP/\d\.\d"
