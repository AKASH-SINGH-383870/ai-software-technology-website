# =============================================================================
# AI SOFTWARE TECHNOLOGY (https://aisoftwaretechnology.in)
# STAGE 1 BOOTSTRAP HTTP-ONLY NGINX CONFIG (PRE-CERTBOT ACME VALIDATION)
# Used by: deploy/scripts/provision-tls-and-nginx.sh BEFORE Let's Encrypt certs
# exist on disk, preventing nginx -t failure on missing ssl_certificate files.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name aisoftwaretechnology.in www.aisoftwaretechnology.in;

    server_tokens off;
    autoindex off;

    root /var/www/aisoftwaretechnology.in/current/dist;
    index index.html;

    # Allow Let's Encrypt HTTP-01 ACME certificate validation
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    # Block dot-files and sensitive extensions even during bootstrap
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
