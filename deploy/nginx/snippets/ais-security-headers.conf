# =============================================================================
# AI SOFTWARE TECHNOLOGY — SHARED NGINX SECURITY HEADERS SNIPPET
# Place in: /etc/nginx/snippets/ais-security-headers.conf
# Included in server{} and every location{} block that sets add_header
# (Nginx drops parent add_header directives whenever a location block defines
# its own add_header, so this snippet guarantees zero header loss).
# =============================================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self \"https://www.google.com\"), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

# Content Security Policy (Tested against React 19 + Vite 8 + Tailwind + Google Fonts + RemixIcon + Google Maps Embed + WhatsApp + Mixkit Hero Video + i.ibb.co/readdy.ai images)
# Stage 1 (Default for initial 24-48h production burn-in): Report-Only mode
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://i.ibb.co https://readdy.ai https://*.google.com https://*.googleapis.com https://*.gstatic.com; media-src 'self' https://assets.mixkit.co; frame-src https://www.google.com https://maps.google.com; connect-src 'self' https://readdy.ai; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://wa.me; upgrade-insecure-requests;" always;

# Stage 2 (Enforced Mode — uncomment below and comment out Report-Only above after confirming zero browser console CSP warnings):
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://i.ibb.co https://readdy.ai https://*.google.com https://*.googleapis.com https://*.gstatic.com; media-src 'self' https://assets.mixkit.co; frame-src https://www.google.com https://maps.google.com; connect-src 'self' https://readdy.ai; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://wa.me; upgrade-insecure-requests;" always;
