# =============================================================================
# AI SOFTWARE TECHNOLOGY (https://aisoftwaretechnology.in)
# STAGE 2 PRODUCTION-HARDENED HTTPS NGINX CONFIGURATION (REACT 19 + VITE 8 SPA)
# Target OS: Ubuntu 22.04 / 24.04 LTS | Nginx >= 1.18
# Prerequisite:
#   1. /etc/nginx/snippets/ais-security-headers.conf installed
#   2. /etc/nginx/snippets/ais-cloudflare-realip.conf installed
#   3. Let's Encrypt certificate provisioned via:
#      sudo bash deploy/scripts/provision-tls-and-nginx.sh
# =============================================================================

# --- Rate Limiting & Connection Limiting Zones (http context) ----------------
# General HTML/SPA navigation requests: 10 req/sec per real visitor IP (burst 30)
limit_req_zone $binary_remote_addr zone=ais_req_limit:10m rate=10r/s;
# Strict rate limit for suspicious/probed endpoints: 2 req/sec per IP
limit_req_zone $binary_remote_addr zone=ais_strict_limit:10m rate=2r/s;
# Concurrent connection limit per IP
limit_conn_zone $binary_remote_addr zone=ais_conn_limit:10m;

limit_req_status 429;
limit_conn_status 429;

# --- 1. HTTP (Port 80) -> Canonical HTTPS Redirect & ACME Challenge ----------
server {
    listen 80;
    listen [::]:80;
    server_name aisoftwaretechnology.in www.aisoftwaretechnology.in;

    server_tokens off;
    include /etc/nginx/snippets/ais-cloudflare-realip.conf;

    # Allow Let's Encrypt HTTP-01 ACME certificate renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    # Redirect all other HTTP traffic permanently to canonical HTTPS
    location / {
        return 301 https://aisoftwaretechnology.in$request_uri;
    }
}

# --- 2. HTTPS www -> Non-www Canonical Redirect ------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aisoftwaretechnology.in;

    server_tokens off;
    include /etc/nginx/snippets/ais-cloudflare-realip.conf;

    ssl_certificate         /etc/letsencrypt/live/aisoftwaretechnology.in/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/aisoftwaretechnology.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/aisoftwaretechnology.in/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/ais-security-headers.conf;

    return 301 https://aisoftwaretechnology.in$request_uri;
}

# --- 3. Primary Production HTTPS Server (Canonical Domain) -------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aisoftwaretechnology.in;

    root /var/www/aisoftwaretechnology.in/current/dist;
    index index.html;

    # Hide Nginx version & disable directory listing
    server_tokens off;
    autoindex off;

    # Restore visitor IP when proxied through Cloudflare
    include /etc/nginx/snippets/ais-cloudflare-realip.conf;

    # --- TLS 1.2 & TLS 1.3 Hardening (Mozilla Intermediate Profile) ----------
    ssl_certificate         /etc/letsencrypt/live/aisoftwaretechnology.in/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/aisoftwaretechnology.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/aisoftwaretechnology.in/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Request Size, Buffer & Timeout Limits -------------------------------
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Limit concurrent connections per IP
    limit_conn ais_conn_limit 30;

    # --- Access & Error Logging ----------------------------------------------
    access_log /var/log/nginx/aisoftwaretechnology.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/aisoftwaretechnology.error.log warn;

    # --- Restrict HTTP Methods (Static SPA only requires GET, HEAD, OPTIONS) -
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # --- Server-Level Default Security Headers -------------------------------
    include /etc/nginx/snippets/ais-security-headers.conf;

    # --- Block Hidden Dot-Files (except .well-known) -------------------------
    location ~ /\.(?!well-known) {
        limit_req zone=ais_strict_limit burst=5 nodelay;
        deny all;
        log_not_found off;
        return 404;
    }

    # --- Block Sensitive Extensions, Configs, Backups, Source Maps & CMS Probes
    location ~* (?:\.(?:env|git|svn|hg|htaccess|htpasswd|ini|log|sh|sql|bak|old|orig|swp|dist|map|conf|pem|key|crt|p12|pfx|php|asp|aspx|jsp|cgi|py|pl)|package(?:-lock)?\.json|tsconfig.*\.json|vite\.config\.ts|docker-compose\.yml|Dockerfile)$ {
        limit_req zone=ais_strict_limit burst=5 nodelay;
        deny all;
        log_not_found off;
        return 404;
    }

    location ~* ^/(?:wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|adminer|vendor|node_modules|server-status|server-info|actuator|telescope)(?:/|$) {
        limit_req zone=ais_strict_limit burst=5 nodelay;
        deny all;
        log_not_found off;
        return 404;
    }

    # --- SEO & Crawler Public Files (Never Rate-Block Googlebot/Bingbot) -----
    location = /robots.txt {
        access_log off;
        log_not_found off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/ais-security-headers.conf;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/ais-security-headers.conf;
        try_files $uri =404;
    }

    location = /llms.txt {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/ais-security-headers.conf;
        try_files $uri =404;
    }

    location = /manifest.json {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/ais-security-headers.conf;
        try_files $uri =404;
    }

    # --- Fingerprinted Vite Static Assets (Long-Term Immutable Cache) --------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/ais-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # --- Public Images & Icons Cache -----------------------------------------
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/ais-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # --- Canonical URL Normalization (Strip Trailing Slash & Redirect Aliases) -
    rewrite ^/(.+)/$ https://aisoftwaretechnology.in/$1 permanent;

    location = /industries/realestate {
        return 301 https://aisoftwaretechnology.in/industries/real-estate;
    }
    location = /services/web-application-development {
        return 301 https://aisoftwaretechnology.in/services/website-development;
    }
    location = /services/hospital-clinic-management-software {
        return 301 https://aisoftwaretechnology.in/services/hospital-management-software;
    }
    location = /services/school-management-software {
        return 301 https://aisoftwaretechnology.in/services/erp-solutions;
    }
    location = /services/mobile-application-development {
        return 301 https://aisoftwaretechnology.in/services/mobile-app-development;
    }
    location = /services/ui-ux-design-services {
        return 301 https://aisoftwaretechnology.in/services/ui-ux-design;
    }
    location = /services/ecommerce-website-development {
        return 301 https://aisoftwaretechnology.in/services/ecommerce-solutions;
    }

    # --- Custom 404 Error Page (Genuine HTTP 404 Status + React SPA Bundle) ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/ais-security-headers.conf;
    }

    # --- Prerendered Static Route Resolution (HTTP 200 Valid / HTTP 404 Unknown)
    location / {
        limit_req zone=ais_req_limit burst=30 nodelay;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/ais-security-headers.conf;
        try_files $uri $uri/index.html =404;
    }
}
